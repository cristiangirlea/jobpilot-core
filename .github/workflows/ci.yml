name: ci

# Mirrors `make test` (split into parallel jobs) plus image builds and an
# integration pass against a real API. Keep this file and the Makefile in step.
#
# Jobs run only on the lab cluster's self-hosted runners, whose scale set the
# repository variable CI_RUNNER names (set by the infra repo's tofu); unset,
# they are skipped, never sent to GitHub's runners. The cluster's runner image is
# GitHub's runner plus build tools, so the steps install what else they need.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded pull request runs, but let every master commit finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: ${{ matrix.module }} (Go)
    if: ${{ vars.CI_RUNNER != '' }}
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [api, mcp]
    defaults:
      run:
        working-directory: apps/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/${{ matrix.module }}/go.mod
          cache-dependency-path: apps/${{ matrix.module }}/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  web:
    name: web (typecheck)
    if: ${{ vars.CI_RUNNER != '' }}
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: typecheck
        run: npm run typecheck

  images:
    name: docker images
    if: ${{ vars.CI_RUNNER != '' }}
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the API image
        run: docker build apps/api
      - name: Build the web image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:8080/api apps/web
      - name: Build the migrate image
        run: docker build migrations

  manifests:
    name: deploy manifests
    if: ${{ vars.CI_RUNNER != '' }}
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # kustomize renders deploy/base and kubeconform checks it against Kubernetes' schemas, both
      # pinned releases checked against the SHA-256 each publishes.
      - name: Render and validate deploy/base
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/kustomize.tar.gz" https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.2/kustomize_v5.8.2_linux_amd64.tar.gz
          echo "06af0a202c2b831207d0173f9c9cdb1b30abceca0747cb3fbb72792d26055c95  $RUNNER_TEMP/kustomize.tar.gz" | sha256sum -c -
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$bin" kustomize
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$bin" kubeconform
          "$bin/kustomize" build deploy/base > "$RUNNER_TEMP/base.yaml"
          "$bin/kubeconform" -strict -summary -kubernetes-version 1.35.0 "$RUNNER_TEMP/base.yaml"
      # What the infra-bump job runs on master, end to end against a local repository and a stub API.
      - name: infra-bump.sh
        run: |
          command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }
          sh scripts/infra-bump-test.sh

  integration:
    name: integration (API, smoke scripts, MCP end-to-end)
    if: ${{ vars.CI_RUNNER != '' }}
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 20
    needs: [go]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: jobpilot
          POSTGRES_DB: jobpilot
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U jobpilot -d jobpilot"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: jobpilot
      JOBPILOT_API_URL: http://localhost:8080/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Go 1.25 builds both modules; the go job already proves the API's own toolchain.
          go-version-file: apps/mcp/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            apps/mcp/go.sum
      - name: Apply migrations
        env:
          DATABASE_URL: postgres://jobpilot:jobpilot@localhost:5432/jobpilot?sslmode=disable
        run: |
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          sh migrations/migrate.sh
      # migrate.sh's promises: a second run applies nothing; two runs at once on a fresh database
      # both succeed and apply each file once; a database the old loop migrated is accepted (by the image).
      - name: Migrations run once, also when started together
        run: |
          url=postgres://jobpilot:jobpilot@localhost:5432
          n=$(ls migrations/*.sql | wc -l)
          DATABASE_URL="$url/jobpilot?sslmode=disable" sh migrations/migrate.sh > "$RUNNER_TEMP/again.log"
          test "$(grep -c '^skip ' "$RUNNER_TEMP/again.log")" -eq "$n"
          if grep '^apply ' "$RUNNER_TEMP/again.log"; then echo "a second run applied files again"; exit 1; fi

          psql -v ON_ERROR_STOP=1 -h localhost -U jobpilot -d jobpilot -c 'CREATE DATABASE migrate_concurrent' -c 'CREATE DATABASE migrate_legacy'
          DATABASE_URL="$url/migrate_concurrent?sslmode=disable" sh migrations/migrate.sh > "$RUNNER_TEMP/a.log" & a=$!
          DATABASE_URL="$url/migrate_concurrent?sslmode=disable" sh migrations/migrate.sh > "$RUNNER_TEMP/b.log" & b=$!
          wait "$a"; wait "$b"
          test "$(cat "$RUNNER_TEMP/a.log" "$RUNNER_TEMP/b.log" | grep -c '^apply ')" -eq "$n"
          test "$(psql -h localhost -U jobpilot -d migrate_concurrent -tAc 'SELECT count(*) FROM schema_migrations')" -eq "$n"

          for f in migrations/*.sql; do psql -q -v ON_ERROR_STOP=1 -h localhost -U jobpilot -d migrate_legacy -f "$f" > /dev/null; done
          # Through the image, as compose and Kubernetes run it (entrypoint, uid 70, MIGRATIONS_DIR).
          docker build -q -t jobpilot-migrate:ci migrations > /dev/null
          docker run --rm --network host -e DATABASE_URL="$url/migrate_legacy?sslmode=disable" jobpilot-migrate:ci > /dev/null
          test "$(psql -h localhost -U jobpilot -d migrate_legacy -tAc 'SELECT count(*) FROM schema_migrations')" -eq "$n"
      # Tests whose subject is SQL run against the migrated database, before
      # the API starts; without the variable they skip.
      - name: Postgres-backed API tests
        working-directory: apps/api
        env:
          JOBPILOT_TEST_DATABASE_URL: postgres://jobpilot:jobpilot@localhost:5432/jobpilot?sslmode=disable
        run: go test -count=1 -v -run Postgres ./...
      - name: Build and start the API
        env:
          API_ADDR: ":8080"
          DATABASE_URL: postgres://jobpilot:jobpilot@localhost:5432/jobpilot?sslmode=disable
          JWT_SECRET: ci-only-secret
          FRONTEND_URL: http://localhost:3000
          TOKEN_TTL_HOURS: "1"
          LLM_PROVIDER: none
          # The smoke scripts and the MCP end-to-end test create their own
          # accounts; invite-only sign-up has its own Postgres tests.
          REGISTRATION: open
          # The MCP end-to-end test serves a fake Greenhouse here: a form, so
          # the outbox approval and withdrawal paths are covered, and board
          # listings, so a discovery run is. Fake Ashby and Recruitee boards
          # share the port, so composing from their forms is covered too.
          ATS_GREENHOUSE_URL: http://localhost:18999
          ATS_ASHBY_URL: http://localhost:18999
          ATS_RECRUITEE_URL: http://localhost:18999
        run: |
          (cd apps/api && go build -o "$RUNNER_TEMP/api" ./cmd/api)
          nohup "$RUNNER_TEMP/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/api/health && break
            sleep 1
          done
          curl -fsS http://localhost:8080/api/health
      # The cluster's runner image has no PowerShell, so a pinned release is
      # installed when it is missing, checked against the
      # SHA-256 that release publishes.
      - name: PowerShell
        run: |
          command -v pwsh >/dev/null && exit 0
          version=7.6.6
          sha=ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc
          curl -fsSL -o "$RUNNER_TEMP/pwsh.tar.gz" "https://github.com/PowerShell/PowerShell/releases/download/v$version/powershell-$version-linux-x64.tar.gz"
          echo "$sha  $RUNNER_TEMP/pwsh.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pwsh"
          tar -xzf "$RUNNER_TEMP/pwsh.tar.gz" -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"
      - name: Smoke flow
        run: pwsh -File scripts/smoke.ps1
      - name: Regression smoke flow
        run: pwsh -File scripts/seniority-filter-smoke.ps1
      - name: MCP end-to-end over stdio
        working-directory: apps/mcp
        env:
          JOBPILOT_E2E_ATS_PORT: "18999"
        run: go test -count=1 -v -run TestEndToEnd . -args -api http://localhost:8080
      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-log
          path: ${{ runner.temp }}/api.log

  # On master, on the lab runners only, once every check has passed: the images the infra overlay
  # deploys, pushed to the cluster's registry (plain HTTP; the nodes and runner pods use it as
  # registry.localhost:5000) under the commit SHA. The summary carries the overlay's `images:`
  # block, pinned by digest. A newer master run can cancel an older one still waiting to start (the
  # concurrency group); the newer commit's images supersede it. A manual run on master publishes
  # too, which is also how to republish a commit (Run workflow, branch master). The digests are
  # also the job's outputs, for infra-bump.
  publish:
    name: publish images (lab registry)
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.CI_RUNNER != ''
    needs: [go, web, images, manifests, integration]
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      REGISTRY: registry.localhost:5000
    outputs:
      api: ${{ steps.push.outputs.api }}
      web: ${{ steps.push.outputs.web }}
      migrate: ${{ steps.push.outputs.migrate }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and push
        id: push
        run: |
          # curl answers any *.localhost name with loopback itself, while Docker asks DNS: give curl
          # the address the cluster's resolver returns.
          ip=$(getent ahostsv4 registry.localhost | awk 'NR==1 {print $1}')
          test -n "$ip" || { echo "registry.localhost does not resolve on this runner"; exit 1; }
          accept='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'
          out="$RUNNER_TEMP/images.yaml"
          printf '# jobpilot %s\nimages:\n' "$GITHUB_SHA" > "$out"
          publish() { # name, build context, extra docker build arguments
            name=$1 ctx=$2
            shift 2
            ref="$REGISTRY/$name:$GITHUB_SHA"
            docker build --pull "$@" -t "$ref" "$ctx"
            docker push "$ref"
            digest=$(curl -fsSI --resolve "registry.localhost:5000:$ip" -H "Accept: $accept" "http://$REGISTRY/v2/$name/manifests/$GITHUB_SHA" | tr -d '\r' | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: //p') \
              || { echo "the registry did not answer for $ref"; exit 1; }
            test -n "$digest" || { echo "the registry answered for $ref without a digest"; exit 1; }
            printf '  - name: %s\n    newName: %s/%s\n    digest: %s\n' "$name" "$REGISTRY" "$name" "$digest" >> "$out"
            echo "${name#jobpilot-}=$digest" >> "$GITHUB_OUTPUT"
          }
          publish jobpilot-api apps/api
          # One origin behind the Ingress: the browser calls /api on the page's own host.
          publish jobpilot-web apps/web --build-arg NEXT_PUBLIC_API_URL=/api
          publish jobpilot-migrate migrations
          { echo '### Images for the infra overlay'; echo; echo '```yaml'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: ${{ runner.temp }}/images.yaml

  # After publish: the rolling bump PR in infra (branch bump/jobpilot), which pins this commit and
  # its three images in clusters/local/jobpilot.yaml. It skips commits that change nothing deployed,
  # never moves the PR back to an older commit, keeps its description true to the branch, and
  # closes it once infra runs that far; merging the PR is the release, the owner's act.
  # scripts/infra-bump.sh does the work (tested in the manifests job). It authenticates as the
  # owner's bump GitHub App (README, "Kubernetes"), and without the INFRA_BUMP_CLIENT_ID variable
  # the job is skipped.
  infra-bump:
    name: infra bump PR
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.CI_RUNNER != '' && vars.INFRA_BUMP_CLIENT_ID != ''
    needs: [publish]
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The change list and the bump decision compare this commit with the one the lab runs.
          fetch-depth: 0
          persist-credentials: false
      # A token for infra alone, with only what a branch push and a PR need; it is revoked when the
      # job ends. Pinned by commit, since this step holds the App's private key.
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.INFRA_BUMP_CLIENT_ID }}
          private-key: ${{ secrets.INFRA_BUMP_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: infra
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/infra
          ref: main
          path: infra
          token: ${{ steps.app.outputs.token }}
      - name: Open or move the bump PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          SHA: ${{ github.sha }}
          API_DIGEST: ${{ needs.publish.outputs.api }}
          WEB_DIGEST: ${{ needs.publish.outputs.web }}
          MIGRATE_DIGEST: ${{ needs.publish.outputs.migrate }}
          INFRA_REPO: ${{ github.repository_owner }}/infra
          JOBPILOT_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }
          sh scripts/infra-bump.sh open infra
