name: ci

# Mirrors `make test` (split into parallel jobs) plus image builds and an
# integration pass against a real API. Keep this file and the Makefile in step.
#
# Jobs run on the lab cluster's self-hosted runners when the repository
# variable CI_RUNNER names its scale set (set by the infra repo's tofu), and
# on GitHub-hosted runners when it is unset. The cluster's runner image is
# GitHub's runner plus build tools, so the steps install what else they need.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded pull request runs, but let every master commit finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: ${{ matrix.module }} (Go)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [api, mcp]
    defaults:
      run:
        working-directory: apps/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/${{ matrix.module }}/go.mod
          cache-dependency-path: apps/${{ matrix.module }}/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  web:
    name: web (typecheck)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: typecheck
        run: npm run typecheck

  images:
    name: docker images
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the API image
        run: docker build apps/api
      - name: Build the web image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:8080/api apps/web
      - name: Build the migrate image
        run: docker build migrations

  integration:
    name: integration (API, smoke scripts, MCP end-to-end)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    needs: [go]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: jobpilot
          POSTGRES_DB: jobpilot
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U jobpilot -d jobpilot"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: jobpilot
      JOBPILOT_API_URL: http://localhost:8080/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Go 1.25 builds both modules; the go job already proves the API's own toolchain.
          go-version-file: apps/mcp/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            apps/mcp/go.sum
      - name: Apply migrations
        env:
          DATABASE_URL: postgres://jobpilot:jobpilot@localhost:5432/jobpilot?sslmode=disable
        run: |
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          sh migrations/migrate.sh
      # migrate.sh's promises: a second run applies nothing; two runs at once on a fresh database
      # both succeed and apply each file once; a database the old loop migrated is accepted.
      - name: Migrations run once, also when started together
        run: |
          url=postgres://jobpilot:jobpilot@localhost:5432
          n=$(ls migrations/*.sql | wc -l)
          DATABASE_URL="$url/jobpilot?sslmode=disable" sh migrations/migrate.sh > "$RUNNER_TEMP/again.log"
          test "$(grep -c '^skip ' "$RUNNER_TEMP/again.log")" -eq "$n"
          if grep '^apply ' "$RUNNER_TEMP/again.log"; then echo "a second run applied files again"; exit 1; fi

          psql -h localhost -U jobpilot -d jobpilot -c 'CREATE DATABASE migrate_concurrent' -c 'CREATE DATABASE migrate_legacy'
          DATABASE_URL="$url/migrate_concurrent?sslmode=disable" sh migrations/migrate.sh > "$RUNNER_TEMP/a.log" & a=$!
          DATABASE_URL="$url/migrate_concurrent?sslmode=disable" sh migrations/migrate.sh > "$RUNNER_TEMP/b.log" & b=$!
          wait "$a"; wait "$b"
          test "$(cat "$RUNNER_TEMP/a.log" "$RUNNER_TEMP/b.log" | grep -c '^apply ')" -eq "$n"
          test "$(psql -h localhost -U jobpilot -d migrate_concurrent -tAc 'SELECT count(*) FROM schema_migrations')" -eq "$n"

          for f in migrations/*.sql; do psql -q -v ON_ERROR_STOP=1 -h localhost -U jobpilot -d migrate_legacy -f "$f" > /dev/null; done
          DATABASE_URL="$url/migrate_legacy?sslmode=disable" sh migrations/migrate.sh > /dev/null
          test "$(psql -h localhost -U jobpilot -d migrate_legacy -tAc 'SELECT count(*) FROM schema_migrations')" -eq "$n"
      # Tests whose subject is SQL run against the migrated database, before
      # the API starts; without the variable they skip.
      - name: Postgres-backed API tests
        working-directory: apps/api
        env:
          JOBPILOT_TEST_DATABASE_URL: postgres://jobpilot:jobpilot@localhost:5432/jobpilot?sslmode=disable
        run: go test -count=1 -v -run Postgres ./...
      - name: Build and start the API
        env:
          API_ADDR: ":8080"
          DATABASE_URL: postgres://jobpilot:jobpilot@localhost:5432/jobpilot?sslmode=disable
          JWT_SECRET: ci-only-secret
          FRONTEND_URL: http://localhost:3000
          TOKEN_TTL_HOURS: "1"
          LLM_PROVIDER: none
          # The MCP end-to-end test serves a fake Greenhouse here: a form, so
          # the outbox approval and withdrawal paths are covered, and board
          # listings, so a discovery run is.
          ATS_GREENHOUSE_URL: http://localhost:18999
        run: |
          (cd apps/api && go build -o "$RUNNER_TEMP/api" ./cmd/api)
          nohup "$RUNNER_TEMP/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/api/health && break
            sleep 1
          done
          curl -fsS http://localhost:8080/api/health
      # GitHub-hosted runners ship PowerShell and the cluster's do not, so a
      # pinned release is installed when it is missing, checked against the
      # SHA-256 that release publishes.
      - name: PowerShell
        run: |
          command -v pwsh >/dev/null && exit 0
          version=7.6.6
          sha=ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc
          curl -fsSL -o "$RUNNER_TEMP/pwsh.tar.gz" "https://github.com/PowerShell/PowerShell/releases/download/v$version/powershell-$version-linux-x64.tar.gz"
          echo "$sha  $RUNNER_TEMP/pwsh.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pwsh"
          tar -xzf "$RUNNER_TEMP/pwsh.tar.gz" -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"
      - name: Smoke flow
        run: pwsh -File scripts/smoke.ps1
      - name: Regression smoke flow
        run: pwsh -File scripts/seniority-filter-smoke.ps1
      - name: MCP end-to-end over stdio
        working-directory: apps/mcp
        env:
          JOBPILOT_E2E_ATS_PORT: "18999"
        run: go test -count=1 -v -run TestEndToEnd . -args -api http://localhost:8080
      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-log
          path: ${{ runner.temp }}/api.log
