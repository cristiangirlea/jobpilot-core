services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: jobpilot
      POSTGRES_DB: jobpilot
    volumes:
      - jobpilot_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot -d jobpilot"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Applies each migration once (migrations/migrate.sh); the same image is the API's init
  # container in Kubernetes.
  migrate:
    build: ./migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jobpilot:jobpilot@postgres:5432/jobpilot?sslmode=disable
    restart: "no"

  api:
    build: ./apps/api
    environment:
      API_ADDR: :8080
      DATABASE_URL: postgres://jobpilot:jobpilot@postgres:5432/jobpilot?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-sharing}
      FRONTEND_URL: http://localhost:3000
      TOKEN_TTL_HOURS: 168
      # Optional AI adapter; defaults keep the container fully deterministic.
      # LLM_PROVIDER=cli needs the CLI installed inside the container, so for
      # subscription-billed CLI use, run the API natively instead of in Compose.
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_CLI_COMMAND: ${LLM_CLI_COMMAND:-}
      LLM_CLI_ARGS: ${LLM_CLI_ARGS:-}
      LLM_OLLAMA_URL: ${LLM_OLLAMA_URL:-http://host.docker.internal:11434}
      # Point at a fake (for example http://host.docker.internal:18999) to
      # run the MCP end-to-end flow's employer-form section locally.
      ATS_GREENHOUSE_URL: ${ATS_GREENHOUSE_URL:-https://boards-api.greenhouse.io}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      LLM_CALLS_PER_HOUR: ${LLM_CALLS_PER_HOUR:-120}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  jobpilot_postgres:

