services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: jobpilot
      POSTGRES_DB: jobpilot
    volumes:
      - jobpilot_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot -d jobpilot"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Applies each migration once (migrations/migrate.sh); the same image is the API's init
  # container in Kubernetes.
  migrate:
    build: ./migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jobpilot:jobpilot@postgres:5432/jobpilot?sslmode=disable
    restart: "no"

  api:
    build:
      context: ./apps/api
      # ai adds the claude and codex CLIs for LLM_PROVIDER=cli.
      target: ${API_IMAGE_TARGET:-runtime}
    environment:
      API_ADDR: :8080
      DATABASE_URL: postgres://jobpilot:jobpilot@postgres:5432/jobpilot?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-sharing}
      FRONTEND_URL: http://localhost:3000
      TOKEN_TTL_HOURS: 168
      # The API defaults to invite-only sign-up. This local stack defaults to
      # open so make smoke can create its accounts; set REGISTRATION=invite
      # (and ADMIN_EMAILS) before sharing it with anyone.
      REGISTRATION: ${REGISTRATION:-open}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      USER_AGENT_TOKENS: ${USER_AGENT_TOKENS:-off}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      # Optional sign-in with Google, off while GOOGLE_CLIENT_ID is empty.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      GOOGLE_ALLOW_SIGNUP: ${GOOGLE_ALLOW_SIGNUP:-}
      # Verification and reset emails; unset sends nothing (see .env.example).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Optional AI adapter; defaults keep the container fully deterministic.
      # LLM_PROVIDER=cli needs API_IMAGE_TARGET=ai, the image with the CLIs.
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_BACKUP_PROVIDER: ${LLM_BACKUP_PROVIDER:-none}
      LLM_BACKUP_MODEL: ${LLM_BACKUP_MODEL:-}
      LLM_BACKUP_TIMEOUT_SECONDS: ${LLM_BACKUP_TIMEOUT_SECONDS:-180}
      LLM_MODEL: ${LLM_MODEL:-}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-}
      EXTRACTION_SCORING: ${EXTRACTION_SCORING:-}
      LLM_CLI_COMMAND: ${LLM_CLI_COMMAND:-}
      LLM_CLI_ARGS: ${LLM_CLI_ARGS:-}
      LLM_CLI_DIR: ${LLM_CLI_DIR:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      LLM_OLLAMA_URL: ${LLM_OLLAMA_URL:-http://host.docker.internal:11434}
      # Point at a fake (for example http://host.docker.internal:18999) to
      # run the MCP end-to-end flow's employer-form section locally.
      ATS_GREENHOUSE_URL: ${ATS_GREENHOUSE_URL:-https://boards-api.greenhouse.io}
      ATS_ASHBY_URL: ${ATS_ASHBY_URL:-https://jobs.ashbyhq.com}
      ATS_RECRUITEE_URL: ${ATS_RECRUITEE_URL:-}
      OUTBOX_SENDER_ENABLED: ${OUTBOX_SENDER_ENABLED:-false}
      OUTBOX_SEND_DELAY_SECONDS: ${OUTBOX_SEND_DELAY_SECONDS:-120}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      LLM_CALLS_PER_HOUR: ${LLM_CALLS_PER_HOUR:-120}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Only with the ollama profile: the backup model is on disk before the API starts.
      ollama-pull:
        condition: service_completed_successfully
        required: false
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  # The backup AI provider, off unless COMPOSE_PROFILES includes ollama. Reachable only on the
  # Compose network: set LLM_OLLAMA_URL=http://ollama:11434. It runs on the CPU.
  ollama:
    image: ollama/ollama:0.40.16
    profiles: [ollama]
    volumes:
      - jobpilot_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Pulls LLM_BACKUP_MODEL into the volume once; later starts reuse it without the network.
  # A failed pull only warns, so `up --wait` and a release still succeed without the backup.
  ollama-pull:
    image: ollama/ollama:0.40.16
    profiles: [ollama]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_BACKUP_MODEL: ${LLM_BACKUP_MODEL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test -n "$$LLM_BACKUP_MODEL" || { echo "warning: the ollama profile needs LLM_BACKUP_MODEL" >&2; exit 0; };
        ollama show "$$LLM_BACKUP_MODEL" > /dev/null 2>&1 || ollama pull "$$LLM_BACKUP_MODEL" ||
        echo "warning: could not pull $$LLM_BACKUP_MODEL; the backup's drafts use the templates" >&2
    restart: "no"

volumes:
  jobpilot_postgres:
  jobpilot_ollama:

